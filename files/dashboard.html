<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - QuizNest</title>

    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body data-page="dashboard" data-root="../">

    <!-- Header is inserted by js/app.js -->
    <div id="site-header"></div>

    <!-- Everything inside is drawn by js/app.js from the signed-in user's saved progress -->
    <main class="dashboard-main" id="dashboard-root"></main>

    <!-- Footer is inserted by js/app.js -->
    <div id="site-footer"></div>

    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - QuizNest</title>

    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body data-page="signup" data-root="../">

    <!-- Header is inserted by js/app.js -->
    <div id="site-header"></div>

    <main>
        <section class="auth-section">
            <div class="auth-card">

                <h2>Create Account</h2>
                <p class="auth-subtext">Join QuizNest and track your quiz progress.</p>

                <!-- Success / error message appears here (same page, no alert()) -->
                <div id="form-message" class="form-message" hidden></div>

                <!-- novalidate: our JavaScript shows the messages instead of the browser's pop-ups -->
                <form id="signup-form" novalidate>

                    <div class="auth-field">
                        <label for="su-name">Name</label>
                        <input type="text" id="su-name" name="name" placeholder="Your name" autocomplete="name">
                    </div>

                    <div class="auth-field">
                        <label for="su-email">Email</label>
                        <input type="email" id="su-email" name="email" placeholder="you@example.com" autocomplete="email">
                    </div>

                    <div class="auth-field">
                        <label for="su-password">Password</label>
                        <input type="password" id="su-password" name="password" placeholder="At least 8 characters" autocomplete="new-password">
                        <p class="field-hint">Use 8+ characters with at least one letter and one number.</p>
                    </div>

                    <div class="auth-field">
                        <label for="su-confirm">Confirm Password</label>
                        <input type="password" id="su-confirm" name="confirm" placeholder="Re-enter your password" autocomplete="new-password">
                    </div>

                    <button type="submit" class="auth-submit" id="signup-submit">Create Account</button>

                </form>

                <p class="auth-switch">Already have an account? <a href="signin.html">Sign In</a></p>

            </div>
        </section>
    </main>

    <!-- Footer is inserted by js/app.js -->
    <div id="site-footer"></div>

    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>

</body>
</html>
